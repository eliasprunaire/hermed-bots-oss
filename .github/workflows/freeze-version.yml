name: Freeze version

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions: {}

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm ci
      - name: Install zsh (runner-publish tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: npm test
      - run: npm run lint
      - name: Freeze this commit with a lightweight version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          node scripts/distribution.js version "$tag"
          existing=$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA"
          else
            latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
            if [ -n "$latest" ]; then
              test "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -1)" = "$tag"
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
