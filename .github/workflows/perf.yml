name: Perf probes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Même image Swift que ci.yml (swift-test).
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Performance probes
        run: swift test --package-path Packages/HermesAdapter --filter PerfTests
