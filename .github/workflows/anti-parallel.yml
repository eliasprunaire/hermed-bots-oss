name: Anti-parallel lock

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

run-name: anti-parallel pr-${{ github.event.pull_request.number || github.event.issue.number }}

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: verifier-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  anti-parallel:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Fail closed on parallel verifiers or executors
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          checker="$RUNNER_TEMP/check-anti-parallel.js"
          if git cat-file -e "$BASE_SHA:scripts/check-anti-parallel.js" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-anti-parallel.js" > "$checker"
          else
            echo "::notice::scripts/check-anti-parallel.js is absent on the base: using the PR copy"
            cp scripts/check-anti-parallel.js "$checker"
          fi
          node "$checker"
