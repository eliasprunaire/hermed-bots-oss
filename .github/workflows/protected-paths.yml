name: Protected paths

on:
  pull_request:

permissions:
  contents: read

jobs:
  protected-agent-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fail on changes to agent config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # run the checker as it exists on the base branch, so a PR cannot weaken its own gate
          checker="$RUNNER_TEMP/check-protected-paths.js"
          if git cat-file -e "$BASE_SHA:scripts/check-protected-paths.js" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check-protected-paths.js" > "$checker"
          else
            echo "::notice::scripts/check-protected-paths.js is absent on the base: using the PR copy"
            cp scripts/check-protected-paths.js "$checker"
          fi
          node "$checker" --base "$BASE_SHA" --head "$HEAD_SHA"
