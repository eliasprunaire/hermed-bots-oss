name: Protected paths

# pull_request_target: GitHub reads this definition from the base branch, so a pull cannot
# disable the job by editing this file (for example with `if: false`)
# the job checks out the base branch only: nothing from the pull is checked out or run
#
# workflow_run: GITHUB_SHA is the last commit on the default branch, so a job on this event
# cannot itself satisfy a required check on the pull head. verdict-gate completing does
# emit workflow_run even when that workflow posted its commit status with GITHUB_TOKEN,
# which does not start a `status` workflow. This job then reruns only protected-agent-config
# on the pull_request_target run already attached to that head. A full-run rerun is not
# used: it would also start refresh-on-verdict again.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["Verdict gate"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  refresh-on-verdict:
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'labeled' || github.event.action == 'unlabeled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Installer les dépendances
        run: npm ci
      - name: Relancer le contrôle requis sur le sha de tête
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-protected-paths.js --refresh

  protected-agent-config:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Installer les dépendances
        run: npm ci
      - name: Fail on changes to agent config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          # the head commit comes in as git objects only; git diff reads them, nothing is extracted
          # the anonymous fetch works because the repository is public; a private one needs a token here
          git fetch --no-tags origin "$HEAD_SHA"
          node scripts/check-protected-paths.js --base "$BASE_SHA" --head "$HEAD_SHA"
