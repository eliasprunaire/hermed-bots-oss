name: infra-guard
# Rule 13: refuse infrastructure information in PR diffs, PR bodies, pushes and comments.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Scan event (diff, body, comment)
        run: node scripts/infra-guard-ci.js
